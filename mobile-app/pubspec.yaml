name: pesa_shop
description: PESA Shop - Production-ready WooCommerce mobile app with complete visual control

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI Components
  cupertino_icons: ^1.0.6

  # State Management
  provider: ^6.1.1
  flutter_riverpod: ^2.4.9

  # HTTP & API
  http: ^1.1.2
  dio: ^5.4.0

  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # WebView
  webview_flutter: ^4.4.2
  flutter_inappwebview: ^6.0.0

  # Image Handling
  cached_network_image: ^3.3.1
  carousel_slider: ^4.2.1

  # HTML Rendering
  flutter_html: ^3.0.0-beta.2

  # Navigation
  go_router: ^13.0.0

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.2.2
  shimmer: ^3.0.0
  flutter_svg: ^2.0.9

  # Authentication
  jwt_decoder: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true

  # Assets
  # assets:
  #   - images/
  #   - assets/

  # Fonts
  fonts:
    - family: Roboto
      fonts:
        - asset: fonts/Roboto-Regular.ttf
        - asset: fonts/Roboto-Bold.ttf
          weight: 700
